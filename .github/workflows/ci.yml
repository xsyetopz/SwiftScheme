name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Swift tests
        run: swift test
      - name: Repository fixtures
        run: python3 Scripts/run-fixtures.py
      - name: Chibi R5RS corpus
        run: python3 Scripts/run-chibi-r5rs.py
